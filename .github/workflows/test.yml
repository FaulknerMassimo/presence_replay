name: Test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Floor of 0.13.348: earlier releases pin freezegun==1.5.2, which
          # doesn't patch the asyncio loop's monotonic clock that
          # async_call_later schedules against (loop.call_at) -- debounce
          # timers never fire under freezegun there, failing tests that are
          # correct against >=0.13.348 (freezegun==1.5.5).
          pip install "pytest-homeassistant-custom-component>=0.13.348" ruff
      - name: Versions
        run: pip show pytest-homeassistant-custom-component homeassistant freezegun | grep -E "^(Name|Version)"
      - name: Ruff
        run: ruff check custom_components tests
      - name: Pytest
        run: pytest tests
